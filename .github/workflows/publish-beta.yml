name: publish-beta

# 预览发版（参考 NewLife.Core）：master/main 推送且核心或服务端源码变更时，打包日期+时间版本，
# 同时推送 GitHub Packages 与 NuGet.org。预览包不创建 GitHub Release。

on:
  push:
    branches:
        - master
        - main
    paths:
        - 'NewLife.JT1078/**'
        - 'NewLife.JT1078.Server/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Get Version
      run: echo "VERSION=$(date '+%Y.%m%d-beta%H%M')" >> $GITHUB_ENV
    - name: Restore
      run: |
        dotnet restore NewLife.JT1078/NewLife.JT1078.csproj
        dotnet restore NewLife.JT1078.Server/NewLife.JT1078.Server.csproj
    - name: Pack
      run: |
        dotnet pack --no-restore --version-suffix ${{ env.VERSION }} -c Release -o out NewLife.JT1078/NewLife.JT1078.csproj
        dotnet pack --no-restore --version-suffix ${{ env.VERSION }} -c Release -o out NewLife.JT1078.Server/NewLife.JT1078.Server.csproj
    - name: Verify packages
      shell: pwsh
      run: ./tools/check-packages.ps1
    - name: Publish to GitHub Packages
      # 备用镜像渠道，失败只告警，不阻断 NuGet.org 预览发布；GitHub Packages 不支持符号包，显式跳过 snupkg
      continue-on-error: true
      run: |
        dotnet nuget push ./out/*.nupkg --skip-duplicate --no-symbols --source https://nuget.pkg.github.com/NewLifeX/index.json --api-key ${{ github.token }}
    - name: Publish to NuGet.org
      run: |
        dotnet nuget push ./out/*.nupkg --skip-duplicate --no-symbols --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.nugetKey }}
        dotnet nuget push ./out/*.snupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.nugetKey }}
    - name: Upload packages
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nupkg
        path: out/**
        if-no-files-found: ignore