name: aot

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  native-aot:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.x
    - name: Install AOT toolchain
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: Publish NativeAOT
      run: dotnet publish AotSmoke/AotSmoke.csproj -c Release -r linux-x64 -o out
    - name: Run smoke
      run: ./out/AotSmoke
