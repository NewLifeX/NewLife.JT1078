"Device command bus is not initialized.": "장치 명령 버스가 초기화되지 않았습니다."
"Request must not be null.": "요청은 null일 수 없습니다."
"Command sent.": "명령을 보냈습니다."
"Device is offline; the command has been broadcast to the cluster.": "장치가 오프라인입니다. 명령이 클러스터에 브로드캐스트되었습니다."
"Recording file not found.": "녹화 파일을 찾을 수 없습니다."
